<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI客服系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <!-- 聊天头部 -->
        <div class="chat-header">
            <div class="header-info">
                <div class="avatar">
                    <div class="avatar-icon">🤖</div>
                    <div class="online-indicator"></div>
                </div>
                <div class="info">
                    <h3>AI客服助手</h3>
                    <span class="status">
                        <span class="status-dot"></span>
                        <span id="connectionStatus">在线</span>
                    </span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="clearChat()" title="清空对话">
                    🗑️
                </button>
                <button class="btn-transfer" onclick="requestHumanService()">
                    转人工
                </button>
            </div>
        </div>

        <!-- 聊天消息区域 -->
        <div class="chat-messages" id="chatMessages">
            <!-- 系统欢迎消息 -->
            <div class="message system">
                <div class="message-content">
                    <p>您好！我是AI客服助手，很高兴为您服务。</p>
                    <p>请描述您的问题，我会尽力为您解答。</p>
                </div>
                <div class="message-time">系统消息</div>
            </div>
            
            <!-- 快捷回复区域 -->
            <div class="quick-replies" id="quickReplies">
                <button class="quick-reply-btn" onclick="sendQuickReply('您好，我想咨询一下')">您好，我想咨询一下</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('订单什么时候到？')">订单什么时候到？</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('如何申请退款？')">如何申请退款？</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('转人工客服')">转人工客服</button>
            </div>
        </div>

        <!-- 聊天输入区域 -->
        <div class="chat-input">
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="请输入您的问题..." autocomplete="off">
                <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                    <span class="send-icon">➤</span>
                </button>
            </div>
            <div class="input-actions">
                <span class="char-count" id="charCount">0/500</span>
                <span class="input-hint">按 Enter 发送 | Shift+Enter 换行</span>
            </div>
        </div>

        <!-- 转人工提示框 -->
        <div class="transfer-modal" id="transferModal">
            <div class="modal-content">
                <h3>转人工客服</h3>
                <p>您确定要转人工客服吗？</p>
                <textarea id="transferReason" placeholder="请说明转人工的原因（可选）"></textarea>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="cancelTransfer()">取消</button>
                    <button class="btn-confirm" onclick="confirmTransfer()">确认转接</button>
                </div>
            </div>
        </div>

        <!-- 工单状态提示 -->
        <div class="ticket-status" id="ticketStatus">
            <div class="status-content">
                <div class="status-icon loading">
                    <div class="spinner"></div>
                </div>
                <div class="status-text">
                    <p>工单已创建，等待客服接入...</p>
                    <p class="ticket-id">工单ID: <span id="ticketIdDisplay"></span></p>
                </div>
                <button class="btn-close-status" onclick="hideTicketStatus()">×</button>
            </div>
        </div>

        <!-- Toast通知 -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
